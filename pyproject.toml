[project]
name = "so101-flywheel"
version = "0.1.0"
description = "SO-101 zero to hero: tray inspection, MuJoCo sim and parametric CAD around plain LeRobot recording and training"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco==3.12.0",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "manifold3d>=3.0",
    "pillow>=10.0",
    "imageio[ffmpeg]>=2.34",
    "opencv-python-headless>=4.9",
]

[project.scripts]
flywheel-sim = "flywheel.sim.cli:main"
flywheel-cad = "flywheel.hardware.cli:main"
flywheel-inspect = "flywheel.qc.cli:main"
flywheel-status = "flywheel.status:main"

[project.optional-dependencies]
robot = [
    "anthropic>=2.3.0",
    "lerobot[feetech,dataset,training,viz,pynput-dep,smolvla]==0.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flywheel"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.8",
    "markdown>=3.6",  # site/build.py
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E731", "E741", "B905", "B007"]
