<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SO-101 QC Cell</title>
<meta name="description" content="SO-101 quality control cell: MuJoCo simulation, parts set and plan-driven recording.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#08080a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2308080a' stroke='%23c8cbd1' stroke-width='1.5'/%3E%3Cpath d='M9 20l5-8 4 5 5-7' stroke='%23ff7d29' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div class="veil"></div>

<div id="hot"></div>
<div id="pip"></div>

<header class="hd">
  <div class="mark"><span class="mark-o"></span><span><b>SO-101</b><i>Quality Control Cell</i></span></div>
  <div class="hd-r">
    <button class="now" id="now"></button>
    <button class="ghost" id="open-drawer">Commands</button>
  </div>
</header>

<section class="cap" id="cap">
  <div class="cap-no" id="cap-no"></div>
  <h1 class="cap-title" id="cap-title"></h1>
  <p class="cap-line" id="cap-line"></p>
  <div class="cap-extra" id="cap-extra"></div>
</section>

<div id="hud"></div>

<nav class="rail" id="rail"></nav>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-in">
    <div class="drawer-hd"><span>Commands</span><button class="x" id="close-drawer" aria-label="Close">×</button></div>
    <div id="drawer-body"></div>
  </div>
</aside>

<div class="loader" id="loader"><div class="loader-in"><b>SO-101</b><span id="load-pct">0</span><i><em id="load-bar"></em></i></div></div>

<script src="data.js"></script>
<script type="module" src="main.js"></script>
</body>
</html>
